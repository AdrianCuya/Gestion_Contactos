<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Duckworth</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos de historial (subiendo un nivel desde views/) -->
    <link rel="stylesheet" href="../assets/css/historial.css">
</head>
<body class="flex h-screen overflow-hidden text-gray-800">

    <!-- BARRA LATERAL (SIDEBAR NEGRO) -->
    <aside class="w-64 bg-black text-white flex flex-col justify-between p-4 flex-shrink-0 z-10 select-none">
        <div>
            <!-- Header / Logo -->
            <div class="flex items-center gap-3 px-3 py-4 mb-6 border-b border-gray-800">
                <span class="font-semibold text-lg tracking-wide text-gray-100">Sistema Inteligente</span>
            </div>

            <!-- Menú de Navegación -->
            <nav class="space-y-1.5">
                <a href="perfil.html" class="nav-btn flex items-center gap-3.5 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-zinc-900 transition-all font-medium text-sm">
                    <i class='bx bx-user text-xl'></i>
                    <span>Perfil</span>
                </a>

                <a href="pagina_contactos.html" class="nav-btn flex items-center gap-3.5 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-zinc-900 transition-all font-medium text-sm">
                    <i class='bx bx-book-content text-xl'></i>
                    <span>Contactos</span>
                </a>

                <a href="historial.html" class="nav-btn flex items-center gap-3.5 px-4 py-3 rounded-xl bg-slate-700/80 text-white font-medium text-sm transition-all shadow-sm">
                    <i class='bx bx-history text-xl'></i>
                    <span>Historial</span>
                </a>

                <a href="asistente.html" class="nav-btn flex items-center gap-3.5 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-zinc-900 transition-all font-medium text-sm">
                    <i class='bx bx-bot text-xl'></i>
                    <span>Asistente IA</span>
                </a>

                <a href="configuracion.html" class="nav-btn flex items-center gap-3.5 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-zinc-900 transition-all font-medium text-sm">
                    <i class='bx bx-cog text-xl'></i>
                    <span>Configuración</span>
                </a>
            </nav>
        </div>

        <!-- Widget Usuario Conectado -->
        <div class="bg-[#121f1d] border border-[#1b3d35] rounded-lg p-3 mt-auto shadow-md">
            <span class="text-[10px] uppercase font-semibold tracking-wider text-[#4ade80] block mb-1">
                Usuario Conectado
            </span>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <span id="user-name-display" class="text-sm font-medium text-gray-200">Prueba 0</span>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col min-w-0 bg-white overflow-y-auto p-8">
        <div class="max-w-5xl mx-auto w-full border border-gray-300 rounded-lg p-6 bg-white shadow-sm">
            <!-- Filtros Rápidos -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold mb-3 text-gray-800">Filtros Rápidos</h3>
                <div class="flex gap-8">
                    <button class="btn-filtro active text-sm font-medium px-3 py-1.5 rounded bg-slate-200" data-filtro="todos">
                        Todos ( <span id="cant-todos">0</span> )
                    </button>
                    <button class="btn-filtro text-sm font-medium px-3 py-1.5 rounded hover:bg-slate-100" data-filtro="OCR">
                        Escaneos OCR ( <span id="cant-ocr">0</span> )
                    </button>
                    <button class="btn-filtro text-sm font-medium px-3 py-1.5 rounded hover:bg-slate-100" data-filtro="MANUAL">
                        Manuales ( <span id="cant-manual">0</span> )
                    </button>
                </div>
            </div>

            <!-- Lista de Registros por Fecha -->
            <div class="historial-feed" id="historialFeed">
                <!-- Se renderiza dinámicamente con JS -->
            </div>
        </div>
    </main>

    <!-- Archivo JS con ruta relativa corregida hacia la raíz del proyecto -->
    <script src="../assets/js/historial.js"></script>
</body>
</html>
