<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión Contactos IA</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>

    <!-- Encabezado superior con Logo y Slogan -->
    <header class="header-login">
        <div class="box-logo">
            <img src="/logos/logo1.png" alt="Logo" class="logo-top">
        </div>
       
    </header>

    <!-- Contenido Principal -->
    <main class="contenedor-principal-login">
        
        <!-- Título Central -->
        <h1 class="titulo-sistema">
            Sistema Inteligente de Gestión de<br>Contactos
        </h1>

        <!-- Tarjeta del Formulario -->
        <div class="tarjeta-login">
            <h2 class="subtitulo-login">Iniciar Sesión</h2>

            <form class="form-login">
                <div class="campo-login">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" required>
                </div>

                <div class="campo-login">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>

            <div class="footer-login-card">
                <p>¿No tienes cuenta?</p>
                <a href="registro.html" class="enlace-registro">Regístrate aquí</a>
            </div>
        </div>

    </main>

   
    <!-- SCRIPT DE CONEXIÓN CON FLASK Y REDIRECCIÓN A PÁGINA PRINCIPAL -->
    <script>
        // Escuchar el evento de envío del formulario de login
        document.querySelector('.form-login').addEventListener('submit', async function(e) {
            // Evitar que el formulario recargue la página por defecto
            e.preventDefault();

            // Campo correo y la contraseña ingresados por el usuario
            const email = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            try {
                // Envia la solicitud POST a la API de Flask
                const response = await fetch('http://127.0.0.1:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                // Valida si la respuesta de Flask fue exitosa (código HTTP 200)
                if (response.ok) {
                    // Guardar los datos del usuario autenticado en localStorage
                    localStorage.setItem('usuarioActivo', JSON.stringify(data.user));

                    // Redirigir al usuario a la página principal del sistema
                    window.location.href = "pagina_contactos.html";
                } else {
                    // Mostrar mensaje de error proveniente del backend si las credenciales fallan
                    alert("Error: " + (data.message || "Correo o contraseña incorrectos"));
                }
            } catch (error) {
                console.error("Error en la conexión con la API:", error);
                alert("No se pudo conectar con el servidor backend. Revisa que Flask esté corriendo.");
            }
        });
    </script>

</body>
</html>
